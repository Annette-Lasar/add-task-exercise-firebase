<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Join - Contacts</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="../assets/img/icons/join-logo.svg"
    />
    <link rel="stylesheet" href="../css/reset_stylesheet.css" />
    <link rel="stylesheet" href="../css/fonts.css" />
    <link rel="stylesheet" href="../css/variables.css" />
    <link rel="stylesheet" href="../css/contacts.css" />
    <link rel="stylesheet" href="../css/style.css" />

  <body class="main-page" id="page">
    <header class="add-task-header">
      <h1>Contacts</h1>
      <div class="add-contact">
        <p>Add a new contact</p>
        <form id="contact_form">
          <div class="form-wrapper">
            <div class="input-wrapper">
              <label for="name">Name<span>:</span></label>
              <input name="name" type="text" />
            </div>

            <div class="input-wrapper">
              <label for="email">E-mail<span>:</span></label>
              <input name="email" type="text" />
            </div>

            <div class="input-wrapper">
              <label for="phone">Phone<span>:</span></label>
              <input name="phone" type="text" />
            </div>
          </div>
          <button class="add-contact-btn" type="submit" onclick="createContact()">Create contact</button>
        </form>
      </div>
    </header>
    <main class="main-container main" id="main-view">
      <ul id="contacts_list" class="contacts-list">
        Contacts
      </ul>
    </main>

    <nav class="main-nav">
      <img
        class="nav-join-img"
        src="../assets/img/icons/join-logo-white.svg"
        alt=""
      />
      <ul class="main-nav-list">
        <li class="main-nav-item">
          <a href="../index.html">
            <img src="../assets/img/icons/summary-icon.svg" alt="" />
            <span>Home</span>
          </a>
        </li>

        <li class="main-nav-item">
          <a href="../html/add-task.html">
            <img src="../assets/img/icons/addtask-icon.svg" alt="" />
            <span> Add Task </span>
          </a>
        </li>

        <li class="main-nav-item">
          <a href="#">
            <img src="../assets/img/icons/board-icon.svg" alt="" />
            <span> No access </span>
          </a>
        </li>

        <li class="main-nav-item">
          <a href="../html/contacts.html" aria-current="page">
            <img src="../assets/img/icons/contact-icon.svg" alt="" />
            <span> Contacts </span>
          </a>
        </li>
      </ul>

      <ul class="main-nav-legal">
        <li>
          <a href="#">Privacy Policy</a>
        </li>

        <li>
          <a href="#">Legal Notice</a>
        </li>
      </ul>
    </nav>
  </body>
</html>
